# This file stores configurations for your Shopify app.
# client_id is intentionally empty — no app has been linked to a Partners
# organization yet. Run `npm run config:link` (shopify app config link) once
# you're ready to connect this project to a real app record, then this file
# will be populated (client_id, application_url, redirect_urls) by the CLI.
name = "AI ImageShoot"
client_id = ""
application_url = "https://example.com"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# Phase 1 (catalog sync, product/image browsing, source-image selection) is
# entirely read-only against the Shopify Admin API — see
# docs/shopify-integration.md "Access scopes". `write_products` is not
# requested; it will be added, deliberately and with its own merchant
# consent flow, only when a later phase publishes generated media back to
# Shopify. See tests/unit/shopify-scope-safety.test.ts for the regression
# guard on this.
scopes = "read_products"

[auth]
redirect_urls = [ "https://example.com/auth/callback" ]

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2025-10"

  # Handled by: /app/routes/webhooks.app.uninstalled.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  # Handled by: /app/routes/webhooks.app.scopes_update.tsx
  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  # Phase 1 — keeps the local catalog sync (ShopifyProduct/ShopifyProductMedia)
  # up to date. See services/products/sync.server.ts and docs/database.md.
  # Handled by: /app/routes/webhooks.products.create.tsx
  [[webhooks.subscriptions]]
  topics = [ "products/create" ]
  uri = "/webhooks/products/create"

  # Handled by: /app/routes/webhooks.products.update.tsx
  [[webhooks.subscriptions]]
  topics = [ "products/update" ]
  uri = "/webhooks/products/update"

  # Handled by: /app/routes/webhooks.products.delete.tsx
  [[webhooks.subscriptions]]
  topics = [ "products/delete" ]
  uri = "/webhooks/products/delete"

  # Webhooks can have filters
  # Only receive webhooks for product updates with a product price >= 10.00
  # See: https://shopify.dev/docs/apps/build/webhooks/customize/filters
  # [[webhooks.subscriptions]]
  # topics = ["products/update"]
  # uri = "/webhooks/products/update"
  # filter = "variants.price:>=10.00"

  # Mandatory compliance topics for public apps — see
  # https://shopify.dev/docs/apps/build/privacy-law-compliance. This app
  # holds no customer/PII data (see app/routes/webhooks.customers.*.tsx's
  # doc comments); shop/redact deletes every row this app holds for the
  # shop (services/shopify/shop-redaction.server.ts).
  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = ["customers/data_request"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = ["customers/redact"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = ["shop/redact"]
