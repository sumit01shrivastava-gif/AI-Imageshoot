# Explicit Nixpacks phase config for Railway — the single authoritative
# build-phase definition (railway.json owns deploy/start only).
#
# Prisma generation is deliberately NOT part of npm's install lifecycle
# (no "postinstall" script — see package.json): it runs explicitly here,
# in the build phase, after the full source tree (including
# prisma/schema.prisma) is guaranteed present, with an explicit
# --schema path rather than relying on Prisma's auto-discovery.

[phases.install]
cmds = ["npm ci --omit=dev --ignore-scripts"]

[phases.build]
cmds = [
  "npx prisma generate --schema=./prisma/schema.prisma",
  "npx prisma migrate deploy"
]
